name: Validate local invoice workflow
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - name: Install Tesseract on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install Tesseract on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          "$env:ProgramFiles\Tesseract-OCR" >> $env:GITHUB_PATH
      - run: python scripts/setup_ocr.py
      - run: python scripts/setup_digits.py
      - run: python scripts/setup_sequences.py
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q
      - name: Build Windows source bundle
        if: runner.os == 'Windows'
        run: python scripts/package_windows.py
      - name: Build standalone Windows application
        if: runner.os == 'Windows'
        run: |
          python -m pip install pyinstaller==6.16.0
          python scripts/build_windows.py
      - name: Smoke test standalone Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:INVOICE_DATA_DIR = Join-Path $env:RUNNER_TEMP 'invoice-exe-test'
          $process = Start-Process -FilePath '.\dist\InvoiceAssistant\InvoiceAssistant.exe' -ArgumentList '--no-browser','--port','8877' -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 90; $i++) {
              try { $health = Invoke-RestMethod 'http://127.0.0.1:8877/api/health'; $ready = $true; break } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ready -or -not $health.ocr.hebrew) { throw 'Standalone OCR/server health failed' }
            $company = Invoke-RestMethod 'http://127.0.0.1:8877/api/companies' -Method Post -ContentType 'application/json' -Body '{"name":"Standalone test"}'
            if (-not $company.id) { throw 'Standalone database write failed' }
          } finally { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: |
            test-results/
            dist/*.zip
