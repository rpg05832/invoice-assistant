name: Diagnose bundled OCR in Hebrew Windows paths
on:
  push:
    branches: [work/full-spec]
    paths: ['scripts/diagnose_windows_ocr.py', '.github/workflows/ocr-diagnostics.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  reproduce:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/diagnose_windows_ocr.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ocr-diagnostic
          path: test-results/windows-ocr-diagnostic.json
