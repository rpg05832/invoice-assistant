name: Diagnose native Windows installer
on:
  push:
    branches: [work/full-spec]
    paths: ['.github/workflows/desktop-diagnostics.yml', 'app/desktop.py', 'app/updates.py', 'scripts/setup_webview.py', 'scripts/smoke_desktop.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install fastapi==0.141.1
      - uses: actions/download-artifact@v4
        with:
          name: validation-windows-latest
          run-id: 43695795447
          github-token: '${{ github.token }}'
          path: previous-validation
      - name: Recover previously built GUI executable for diagnosis only
        run: python -c "import zipfile; zipfile.ZipFile('previous-validation/dist/InvoiceAssistant-Windows-x64.zip').extractall('dist')"
      - run: choco install innosetup --yes --no-progress
      - run: python scripts/setup_webview.py
      - run: python scripts/build_installer.py
      - run: python scripts/smoke_desktop.py dist/InvoiceAssistant/InvoiceAssistant.exe --installer dist/InvoiceAssistant-Setup-0.2.0-x64.exe
